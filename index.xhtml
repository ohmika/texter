<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f1f3f5" id="theme-color" />
  <title>Texter</title>
  <style>
    /*<![CDATA[*/
    :root {
      color-scheme: light;
      --page: #ffffff;
      --bar: #f1f3f5;
      --text: #20252b;
      --muted: #65717d;
      --border: #d8dee5;
      --field: #ffffff;
      --accent: #176b87;
      --focus: #176b87;
      --status: #287a4b;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #171a1f;
      --bar: #22272e;
      --text: #e6edf3;
      --muted: #a1abb6;
      --border: #3b434d;
      --field: #1d2229;
      --accent: #70c5e2;
      --focus: #70c5e2;
      --status: #7bd49b;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      color: var(--text);
      background: var(--page);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background-color 120ms ease, color 120ms ease;
    }
    #textbox {
      display: block;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      border: 0;
      border-right: 1px solid var(--border);
      border-radius: 0;
      outline: none;
      background: transparent;
      color: inherit;
      font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: auto;
      resize: none;
      -webkit-overflow-scrolling: touch;
      tab-size: 2;
    }
    #textbox::placeholder { color: var(--muted); opacity: .8; }
    #textbox:focus-visible { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--focus) 45%, transparent); }
    #textbox.narrow { max-width: calc(80ch + 2rem); }
    nav {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: .5rem 1rem;
      min-height: 3.25rem;
      padding: .5rem max(.75rem, env(safe-area-inset-right)) calc(.5rem + env(safe-area-inset-bottom)) max(.75rem, env(safe-area-inset-left));
      border-top: 1px solid var(--border);
      background: var(--bar);
      color: var(--muted);
      font-size: .875rem;
      line-height: 1.4;
    }
    #stats, #controls { display: flex; align-items: center; flex-wrap: wrap; gap: .35rem .65rem; }
    #stats { white-space: nowrap; }
    #controls { justify-content: flex-end; }
    #save { display: inline-flex; align-items: center; flex-wrap: wrap; gap: .4rem; }
    nav a, nav button {
      color: var(--text);
      font: inherit;
    }
    nav a { text-decoration: underline; text-underline-offset: .15em; }
    nav button {
      min-height: 2.35rem;
      padding: .35rem .65rem;
      border: 1px solid var(--border);
      border-radius: .4rem;
      background: var(--field);
      cursor: pointer;
    }
    nav button:hover { border-color: var(--accent); }
    nav a:focus-visible, nav button:focus-visible, nav input:focus-visible, nav select:focus-visible, nav label:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    nav input[type="checkbox"] { width: 1rem; height: 1rem; margin: 0; accent-color: var(--accent); }
    #filename, #extension {
      min-height: 2.4rem;
      padding: .35rem .5rem;
      border: 1px solid var(--border);
      border-radius: .35rem;
      background: var(--field);
      color: var(--text);
      font: inherit;
    }
    #filename { width: 9rem; max-width: 32vw; }
    #extension { min-width: 4.8rem; }
    #file-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); clip-path: inset(50%); white-space: nowrap; }
    #save-status { color: var(--status); font-size: .78rem; }
    #save-status.error { color: #d34b4b; }
    .separator { color: var(--border); user-select: none; }
    @media (max-width: 720px) {
      nav { align-items: stretch; flex-direction: column; gap: .45rem; padding-top: .55rem; font-size: .8125rem; }
      #stats { justify-content: space-between; }
      #controls { justify-content: flex-start; gap: .5rem .75rem; }
      .separator { display: none; }
      #save { display: flex; flex: 1 1 100%; }
      #filename { flex: 1 1 7rem; width: auto; max-width: none; min-width: 0; }
      #extension { flex: 0 0 auto; }
      nav a { display: inline-flex; min-height: 2.35rem; align-items: center; padding: 0 .15rem; }
    }
    @media (max-width: 380px) {
      #controls { column-gap: .55rem; }
      #stats { font-size: .75rem; }
      #textbox { padding: .75rem; }
    }
    @media print {
      body { display: block; height: auto; overflow: visible; color: #000; background: #fff; }
      #textbox { width: 100%; min-height: 95vh; border: 0; overflow: visible; white-space: pre-wrap; color: #000; }
      nav { display: none; }
    }
    /*]]>*/
  </style>
</head>
<body>
  <textarea id="textbox" autofocus="autofocus" spellcheck="false" aria-label="Note text" placeholder="Start typing…"></textarea>

  <nav aria-label="Notepad controls">
    <span id="stats" aria-live="polite">
      <span><strong id="char-count">0</strong> chars</span>
      <span class="separator" aria-hidden="true">│</span>
      <span><strong id="word-count">0</strong> words</span>
      <span class="separator" aria-hidden="true">│</span>
      <span><strong id="line-count">0</strong> lines</span>
      <span id="save-status" role="status">Saved locally</span>
    </span>

    <span id="controls">
      <input type="checkbox" id="fullwidth" />
      <label for="fullwidth">80 columns</label>
      <span class="separator" aria-hidden="true">│</span>
      <input type="checkbox" id="spellcheck" />
      <label for="spellcheck">Spell-check</label>
      <span class="separator" aria-hidden="true">│</span>
      <input type="checkbox" id="darkmode" />
      <label for="darkmode">Dark mode</label>
      <span class="separator" aria-hidden="true">│</span>
      <a href="#" id="print">Print</a>
      <span class="separator" aria-hidden="true">│</span>
      <span id="open">
        <input type="file" id="file-input" accept=".txt,.md,.csv,.json,.xml,.html,.xhtml,.css,.js,.yaml,.yml,.log,text/*,application/json,application/xml" />
        <a href="#" id="open-link">Open</a>
      </span>
      <span class="separator" aria-hidden="true">│</span>
      <span id="save">
        <input id="filename" type="text" value="texter" aria-label="File name" />
        <select id="extension" aria-label="Download file type">
          <option value="txt">.txt</option>
          <option value="md">.md</option>
          <option value="csv">.csv</option>
          <option value="json">.json</option>
          <option value="xml">.xml</option>
          <option value="html">.html</option>
          <option value="xhtml">.xhtml</option>
          <option value="css">.css</option>
          <option value="js">.js</option>
          <option value="yaml">.yaml</option>
        </select>
        <button type="button" id="clear" title="Clear all text">Clear</button>
        <button type="button" id="download">Download</button>
      </span>
    </span>
  </nav>

  <script type="application/javascript">
    //<![CDATA[
    (function () {
      "use strict";

      var STORAGE_KEY = "texter";
      var PREFS_KEY = "texter.preferences";
      var textbox = document.getElementById("textbox");
      var filenameBox = document.getElementById("filename");
      var fileInput = document.getElementById("file-input");
      var extensionSelect = document.getElementById("extension");
      var saveTimer = null;
      var mediaQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

      function getElement(id) { return document.getElementById(id); }

      function readPreferences() {
        try {
          return JSON.parse(window.localStorage.getItem(PREFS_KEY) || "{}") || {};
        } catch (error) {
          return {};
        }
      }

      function savePreferences() {
        try {
          window.localStorage.setItem(PREFS_KEY, JSON.stringify({
            narrow: getElement("fullwidth").checked,
            spellcheck: getElement("spellcheck").checked,
            dark: getElement("darkmode").checked,
            themeChosen: !!readPreferences().themeChosen,
            filename: filenameBox.value,
            extension: extensionSelect.value
          }));
        } catch (error) {
          setStatus("Preferences could not be saved", true);
        }
      }

      function applyTheme() {
        var dark = getElement("darkmode").checked || (!readPreferences().themeChosen && mediaQuery && mediaQuery.matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        getElement("theme-color").setAttribute("content", dark ? "#171a1f" : "#f1f3f5");
      }

      function setStatus(message, isError) {
        var status = getElement("save-status");
        status.textContent = message;
        status.classList.toggle("error", !!isError);
      }

      function updateStats() {
        var value = textbox.value;
        var trimmed = value.trim();
        var words = trimmed ? trimmed.split(/\s+/).length : 0;
        var lines = value === "" ? 0 : value.split(/\r\n|\r|\n/).length;
        getElement("char-count").textContent = value.length;
        getElement("word-count").textContent = words;
        getElement("line-count").textContent = lines;
      }

      function saveLocally() {
        try {
          window.localStorage.setItem(STORAGE_KEY, textbox.value);
          setStatus("Saved locally");
          return true;
        } catch (error) {
          setStatus("Local save failed — download a copy", true);
          return false;
        }
      }

      function scheduleLocalSave() {
        setStatus("Unsaved changes…");
        window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(saveLocally, 350);
      }

      function getFilename() {
        var name = filenameBox.value.trim() || "texter";
        name = name.replace(/\.[^.\/\\]+$/, "");
        name = name.replace(/[\\/:*?"<>|\u0000-\u001f]/g, "-").trim();
        return (name || "texter") + "." + extensionSelect.value;
      }

      function getMimeType(extension) {
        var types = {
          txt: "text/plain", md: "text/markdown", csv: "text/csv", json: "application/json",
          xml: "application/xml", html: "text/html", xhtml: "application/xhtml+xml",
          css: "text/css", js: "text/javascript", yaml: "application/yaml"
        };
        return types[extension] || "text/plain";
      }

      function downloadText(content, filename, mimeType) {
        var blob = new Blob([content], { type: mimeType + ";charset=utf-8" });
        var objectUrl = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = objectUrl;
        link.download = filename;
        link.style.display = "none";
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 1500);
      }

      function updateFromImportedFile(file, content) {
        textbox.value = content;
        filenameBox.value = file.name.replace(/\.[^.]+$/, "") || "texter";
        var match = file.name.match(/\.([^.]+)$/);
        if (match) {
          var ext = match[1].toLowerCase();
          if (ext === "yml") { ext = "yaml"; }
          for (var i = 0; i < extensionSelect.options.length; i += 1) {
            if (extensionSelect.options[i].value === ext) {
              extensionSelect.value = ext;
              break;
            }
          }
        }
        updateStats();
        saveLocally();
        savePreferences();
        textbox.focus();
      }

      textbox.addEventListener("input", function () {
        updateStats();
        scheduleLocalSave();
      });

      textbox.addEventListener("keydown", function (event) {
        if (event.key === "Tab") {
          event.preventDefault();
          var start = textbox.selectionStart;
          var end = textbox.selectionEnd;
          textbox.setRangeText("\t", start, end, "end");
          updateStats();
          scheduleLocalSave();
        }
      });

      window.addEventListener("beforeunload", function () {
        window.clearTimeout(saveTimer);
        saveLocally();
      });

      try {
        textbox.value = window.localStorage.getItem(STORAGE_KEY) || "";
      } catch (error) {
        textbox.value = "";
        setStatus("Local storage unavailable", true);
      }

      var prefs = readPreferences();
      getElement("fullwidth").checked = !!prefs.narrow;
      textbox.classList.toggle("narrow", !!prefs.narrow);
      getElement("spellcheck").checked = !!prefs.spellcheck;
      textbox.spellcheck = !!prefs.spellcheck;
      getElement("darkmode").checked = !!prefs.dark;
      if (prefs.filename) { filenameBox.value = prefs.filename; }
      if (prefs.extension) { extensionSelect.value = prefs.extension; }
      if (typeof prefs.dark === "boolean") { prefs.themeChosen = true; }
      applyTheme();
      textbox.setSelectionRange(textbox.value.length, textbox.value.length);
      updateStats();

      getElement("clear").addEventListener("click", function () {
        if (!textbox.value) { textbox.focus(); return; }
        if (!window.confirm("Clear all text? This cannot be undone.")) { return; }
        window.clearTimeout(saveTimer);
        textbox.value = "";
        updateStats();
        saveLocally();
        textbox.focus();
      });

      getElement("download").addEventListener("click", function () {
        downloadText(textbox.value, getFilename(), getMimeType(extensionSelect.value));
      });

      getElement("open-link").addEventListener("click", function (event) {
        event.preventDefault();
        fileInput.click();
      });

      fileInput.addEventListener("change", function () {
        var file = fileInput.files && fileInput.files[0];
        if (!file) { return; }
        var reader = new FileReader();
        reader.addEventListener("load", function () {
          updateFromImportedFile(file, String(reader.result || ""));
        });
        reader.addEventListener("error", function () {
          setStatus("Could not read that file", true);
        });
        reader.readAsText(file);
        fileInput.value = "";
      });

      getElement("fullwidth").addEventListener("change", function (event) {
        textbox.classList.toggle("narrow", event.target.checked);
        savePreferences();
      });

      getElement("spellcheck").addEventListener("change", function (event) {
        textbox.spellcheck = event.target.checked;
        savePreferences();
      });

      getElement("darkmode").addEventListener("change", function () {
        var current = readPreferences();
        current.themeChosen = true;
        try { window.localStorage.setItem(PREFS_KEY, JSON.stringify({
          narrow: getElement("fullwidth").checked,
          spellcheck: getElement("spellcheck").checked,
          dark: getElement("darkmode").checked,
          themeChosen: true,
          filename: filenameBox.value,
          extension: extensionSelect.value
        })); } catch (error) { setStatus("Preferences could not be saved", true); }
        applyTheme();
      });

      filenameBox.addEventListener("change", savePreferences);
      extensionSelect.addEventListener("change", savePreferences);

      if (mediaQuery) {
        var onSystemThemeChange = function () {
          if (!readPreferences().themeChosen) { applyTheme(); }
        };
        if (mediaQuery.addEventListener) {
          mediaQuery.addEventListener("change", onSystemThemeChange);
        } else if (mediaQuery.addListener) {
          mediaQuery.addListener(onSystemThemeChange);
        }
      }

      getElement("print").addEventListener("click", function (event) {
        event.preventDefault();
        window.print();
      });

      document.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
          window.clearTimeout(saveTimer);
          saveLocally();
          getElement("download").click();
        } else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "o") {
          event.preventDefault();
          fileInput.click();
        }
      });
    }());
    //]]>
  </script>
</body>
</html>
